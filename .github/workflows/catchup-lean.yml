name: Catchup Lean

on:
  push:
    branches: [formalize-v18-manuscript-catchup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catchup-lean-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          build-args: >-
            EverettianDecoherence.Approximation.StabilitySharpness.CoordinatePerspective
            EverettianDecoherence.Approximation.StabilitySharpness.FixedBudgetSlope
            EverettianDecoherence.Approximation.StabilitySharpness.FixedBudgetDiagonal
            EverettianDecoherence.Approximation.OptimalTwoCellTail
            EverettianDecoherence.Approximation.StabilitySharpness.DiffuseFamilyScalar
            EverettianDecoherence.Approximation.StabilitySharpness.DiffuseFamilyModes
            EverettianDecoherence.Approximation.StabilitySharpness.DiffuseFamilyGeometry
            EverettianDecoherence.Approximation.StabilitySharpness.DiffuseFamilyDiagonal
            EverettianDecoherence.Approximation.StabilitySharpness.DiffuseFamilyCellInvariants
            EverettianDecoherence.Audit.StabilityRigiditySharpness
