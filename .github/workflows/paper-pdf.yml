name: Build paper PDF

on:
  push:
    branches:
      - paper-post-t5-stability
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile v0.9 visually audited candidate
        uses: xu-cheng/latex-action@v3
        with:
          root_file: stability_rigidity_sharpness_v09_visually_audited.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: stability-rigidity-sharpness-v09-pdf
          path: |
            paper/stability_rigidity_sharpness_v09_visually_audited.pdf
            paper/stability_rigidity_sharpness_v09_visually_audited.log
          if-no-files-found: error
